name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-de-prueba
          path: app/build/test-exports/

      - name: Volcar Excel
        run: for f in app/build/test-exports/*.xlsx; do echo "ARCHIVO $(basename $f) $(base64 -w0 $f)"; done
