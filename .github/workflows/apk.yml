name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel-de-prueba
          path: app/build/test-exports/

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Leer versión
        id: v
        run: echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Kombos.apk
          cp Kombos.apk "Kombos-v${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kombos-v${{ steps.v.outputs.version }}
          path: Kombos-v${{ steps.v.outputs.version }}.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Kombos.apk "Kombos-$TAG.apk" --clobber
          else
            gh release create "$TAG" Kombos.apk "Kombos-$TAG.apk" \
              --title "Kombos $TAG" \
              --notes "Descarga **Kombos.apk** e instálalo en tu Android."
          fi
